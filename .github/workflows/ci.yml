name: Johden website CI

on:
  push:
    branches: [main, feature/finance-billing, feature/invoicing-saas-portal, fix/clinic-dashboard-kampala-metrics, feature/jbcs-accounting-dashboard-redesign]
  pull_request:
    branches: [main, feature/invoicing-saas-portal]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm ci
      - name: Build website
        run: npm run build
